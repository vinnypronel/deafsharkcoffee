<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1850" role="img" aria-labelledby="title desc">
  <title id="title">Deaf Shark Coffee food menu</title>
  <desc id="desc">Current sandwiches, bites, grab and go drinks, and desserts with prices.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f6ead9"/></linearGradient>
    <style>
      .head{font:900 82px Georgia,serif;letter-spacing:2px;fill:#fff}.bar{fill:#d66f2c}.section{font:900 italic 47px Arial,sans-serif;fill:#fff;text-anchor:middle}.name{font:800 25px Arial,sans-serif;fill:#9f4018}.price{font:800 25px Arial,sans-serif;fill:#9f4018;text-anchor:end}.desc{font:400 18px Georgia,serif;fill:#644638}.rule{stroke:#dcc2ac;stroke-width:2}.small{font:400 16px Arial,sans-serif;fill:#6b4b3a}.foot{font:700 17px Arial,sans-serif;fill:#875836;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1400" height="1850" fill="url(#paper)"/>
  <rect width="1400" height="145" fill="#a4471c"/><text class="head" x="70" y="100">FOOD MENU</text>
  <rect class="bar" x="45" y="180" width="1310" height="78" rx="8"/><text class="section" x="700" y="236">SANDWICHES</text>
  <g transform="translate(75 300)">
    <text class="name">THE DEAF SHARK CUBAN</text><text class="price" x="575">$13.00</text><text class="desc" y="29">Pork, Swiss, ham, pickles, and mustard. With fries.</text>
    <line class="rule" y1="54" x2="575" y2="54"/>
    <text class="name" y="89">CHICKEN DELUXE</text><text class="price" x="575" y="89">$13.00</text><text class="desc" y="118">Breaded chicken, spinach, roasted peppers, fresh</text><text class="desc" y="140">mozzarella, and mayo. With fries.</text>
    <line class="rule" y1="165" x2="575" y2="165"/>
    <text class="name" y="200">CHICKEN PESTO</text><text class="price" x="575" y="200">$13.00</text><text class="desc" y="229">Grilled chicken, spinach, tomato, pesto, and</text><text class="desc" y="251">provolone. With fries.</text>
    <line class="rule" y1="276" x2="575" y2="276"/>
    <text class="name" y="311">GRILLED CHICKEN</text><text class="price" x="575" y="311">$13.00</text><text class="desc" y="340">Chicken, lettuce, tomato, onion, and mayo. With fries.</text>
    <line class="rule" y1="365" x2="575" y2="365"/>
    <text class="name" y="400">CHICKEN CUTLET FUEGO</text><text class="price" x="575" y="400">$13.00</text><text class="desc" y="429">Breaded chicken, lettuce, tomato, pepper jack,</text><text class="desc" y="451">and chipotle mayo.</text>
  </g>
  <g transform="translate(735 300)">
    <text class="name">TUNA WRAP</text><text class="price" x="590">$13.00</text><text class="desc" y="29">Tuna, lettuce, tomato, onion, bacon, and Asiago.</text><text class="desc" y="51">With fries.</text>
    <line class="rule" y1="76" x2="590" y2="76"/>
    <text class="name" y="111">ITALIAN SUB</text><text class="price" x="590" y="111">$12.50</text><text class="desc" y="140">Provolone, ham, salami, onion, lettuce, oregano,</text><text class="desc" y="162">vinegar, and olive oil.</text>
    <line class="rule" y1="187" x2="590" y2="187"/>
    <text class="name" y="222">GARDEN SALAD</text><text class="price" x="590" y="222">$13.00</text><text class="desc" y="251">Choose chicken or tuna. Lettuce, cherry tomatoes,</text><text class="desc" y="273">onion, Asiago, cucumber, and green olives.</text>
    <line class="rule" y1="298" x2="590" y2="298"/>
    <text class="name" y="333">EMILIA GRILLED CHEESE</text><text class="price" x="590" y="333">$12.50</text><text class="desc" y="362">Mortadella, provolone, and honey. With fries.</text>
  </g>

  <rect class="bar" x="45" y="790" width="1310" height="78" rx="8"/><text class="section" x="700" y="846">BITES</text>
  <g transform="translate(75 922)">
    <text class="name">PUPUSAS</text><text class="price" x="575">$4.00</text><text class="desc" y="31">Chicken and cheese, cheese, or revueltas</text><text class="desc" y="55">with beans, cheese, and pork.</text>
    <line class="rule" y1="83" x2="575" y2="83"/>
    <text class="name" y="127">TEQUENOS (4)</text><text class="price" x="575" y="127">$5.99</text><text class="desc" y="158">Golden pastry sticks filled with cheese.</text>
    <line class="rule" y1="188" x2="575" y2="188"/>
    <text class="name" y="232">FRIES</text><text class="price" x="575" y="232">$5.00</text><text class="desc" y="263">Regular or sweet potato fries.</text>
  </g>
  <g transform="translate(735 922)">
    <text class="name">CACHAPA</text><text class="price" x="590">$10.50</text><text class="desc" y="31">Sweet corn pancake filled with cheese.</text>
    <line class="rule" y1="61" x2="590" y2="61"/>
    <text class="name" y="105">MOZZARELLA STICKS (6)</text><text class="price" x="590" y="105">$5.99</text><text class="desc" y="136">Six golden mozzarella sticks.</text>
    <line class="rule" y1="166" x2="590" y2="166"/>
    <text class="name" y="210">CHICKEN WINGS &amp; FRIES</text><text class="price" x="590" y="210">$10.00</text><text class="desc" y="241">Five wings with regular or sweet potato fries.</text>
  </g>

  <rect class="bar" x="45" y="1235" width="1310" height="78" rx="8"/><text class="section" x="700" y="1291">GRAB &amp; GO</text>
  <g transform="translate(75 1367)">
    <text class="name">TROPICANA JUICE (11 OZ)</text><text class="price" x="575">$3.25</text><text class="desc" y="31">Orange juice, apple juice, or lemonade.</text>
    <line class="rule" y1="61" x2="575" y2="61"/>
    <text class="name" y="105">VITA COCO (11 OZ)</text><text class="price" x="575" y="105">$2.95</text><text class="desc" y="136">The Original coconut water.</text>
  </g>
  <g transform="translate(735 1367)">
    <text class="name">VITA COCO (16.9 OZ)</text><text class="price" x="590">$3.95</text><text class="desc" y="31">The Original coconut water.</text>
    <line class="rule" y1="61" x2="590" y2="61"/>
    <text class="name" y="105">GATORADE (20 OZ)</text><text class="price" x="590" y="105">$3.25</text><text class="desc" y="136">Cool Blue, Lemon-Lime, or Fruit Punch.</text>
  </g>

  <rect class="bar" x="45" y="1565" width="1310" height="78" rx="8"/><text class="section" x="700" y="1621">DESSERTS</text>
  <g transform="translate(75 1695)">
    <text class="name">CHOCOFLAN</text><text class="price" x="365">$7.00</text><text class="desc" y="31">Chocolate cake and caramel flan.</text>
  </g>
  <g transform="translate(505 1695)">
    <text class="name">TRES LECHES</text><text class="price" x="365">$6.00</text><text class="desc" y="31">Three-milk sponge cake.</text>
  </g>
  <g transform="translate(935 1695)">
    <text class="name">TIRAMISU</text><text class="price" x="390">$7.00</text><text class="desc" y="31">Espresso-soaked layers.</text>
    <text class="name" y="65">CHEESECAKE</text><text class="price" x="390" y="65">$7.00</text><text class="desc" y="92">New York-style cheesecake.</text>
  </g>
  <text class="foot" x="700" y="1825" text-anchor="middle">DEAF SHARK COFFEE - UNION, NJ</text>
</svg>
